<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ToPu:Weight Editor</title>
  <meta name="description" content="ToPu:Weight Editor - Blender skin weight editing add-on">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#161616">
  <link rel="icon" href="images/icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --accent:      #F0821E;
      --accent-soft: #FFB064;
      --bg:          #161616;   /* neutral grey, no blue tint */
      --bg-alt:      #1e1e1e;
      --bg-side:     #121212;
      --bg-code:     #242424;
      --fg:          #dcdcdc;
      --fg-dim:      #9e9e9e;
      --fg-strong:   #ffffff;
      --line:        #303030;
      --theme-color: var(--accent);
      --sidebar-width: 18rem;
    }

    html, body { background: var(--bg); }
    body { color: var(--fg); }

    /* ---------- sidebar ---------- */
    .sidebar {
      background: var(--bg-side);
      border-right: 1px solid var(--line);
      padding-top: 6px;
    }
    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
    .sidebar > h1 { margin: 1.2rem 0 .6rem; }
    .sidebar > h1 .app-name-link { color: #ffffff !important; font-size: 17px; font-weight: 700; }
    .sidebar > h1 .app-name-link img {
      width: 40px; height: 40px; vertical-align: middle;
      margin-right: .5rem; border-radius: 9px;
    }
    .sidebar ul li a {
      color: var(--fg-dim);
      font-size: 14px;
      line-height: 1.5;
      padding: 2px 0;
      border-left: 2px solid transparent;
      transition: color .12s, border-color .12s;
    }
    .sidebar ul li a:hover { color: var(--accent-soft); text-decoration: none; }
    .sidebar ul li.active > a,
    .sidebar ul li a.active {
      color: var(--accent) !important;
      font-weight: 600;
      border-left-color: var(--accent);
      padding-left: 8px;
    }
    /* section labels */
    .sidebar > .sidebar-nav > ul > li > strong {
      display: block;
      color: var(--fg-dim);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      margin: 1.3rem 0 .35rem;
      padding-bottom: .3rem;
      border-bottom: 1px solid var(--line);
    }
    /* page level */
    .sidebar > .sidebar-nav > ul > li > ul > li > a {
      color: var(--fg);
      font-size: 15px;
      font-weight: 600;
      padding: 4px 0;
    }
    /* heading level (detailed table of contents) */
    .sidebar > .sidebar-nav > ul > li > ul > li > ul > li > a { font-size: 13px; opacity: .92; }
    .sidebar > .sidebar-nav > ul > li > ul > li > ul > li > ul > li > a { font-size: 12.5px; opacity: .78; }
    .sidebar-nav ul ul { border-left: 1px solid var(--line); margin-left: .45rem; padding-left: .7rem; }
    .sidebar-toggle { background: transparent; }
    .sidebar-toggle-button span { background: var(--fg-dim); }

    /* ---------- language switch (top right) ---------- */
    .app-nav { display: none; }
    #lang-switch {
      position: fixed;
      top: 14px;
      right: 78px;              /* clear of the GitHub corner ribbon */
      z-index: 100;
      display: inline-flex;
      background: var(--bg-alt);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      box-shadow: 0 2px 10px rgba(0,0,0,.45);
    }
    #lang-switch a {
      display: block;
      padding: 5px 15px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--fg-dim);
      border-radius: 999px;
      text-decoration: none;
      transition: background .15s, color .15s;
    }
    #lang-switch a:hover { color: var(--fg-strong); }
    #lang-switch a.active { background: var(--accent); color: #171717; }

    /* ---------- content ---------- */
    .content { background: var(--bg); }
    .markdown-section { max-width: 940px; color: var(--fg); }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h1 a,
    .markdown-section h2 a,
    .markdown-section h3 a,
    .markdown-section h4 a { color: #ffffff !important; }
    .markdown-section h1 {
      font-size: 2.1rem;
      font-weight: 700;
      padding-bottom: .45em;
      border-bottom: 2px solid var(--accent);
    }
    .markdown-section h2 {
      margin-top: 2.6rem;
      padding-bottom: .3em;
      border-bottom: 1px solid var(--line);
    }
    .markdown-section h3 {
      margin-top: 1.9rem;
      color: var(--accent-soft) !important;   /* orange, still bright on grey */
    }
    .markdown-section h3 a { color: var(--accent-soft) !important; }
    /* the anchor docsify injects into headings must not dim them */
    .markdown-section .anchor span { color: inherit !important; }
    .markdown-section a { color: var(--accent-soft); }
    .markdown-section strong { color: var(--fg-strong); }
    .markdown-section hr { border-top: 1px solid var(--line); }

    .markdown-section blockquote {
      border-left: 4px solid var(--accent);
      background: #202020;
      color: #cfcfcf;
      border-radius: 0 6px 6px 0;
    }
    .markdown-section blockquote p { color: #cfcfcf; }

    .markdown-section code { color: #ffc07a; background: var(--bg-code); border-radius: 4px; }
    .markdown-section pre { background: var(--bg-code); }
    .markdown-section pre > code { background: transparent; color: #dcdcdc; }

    .markdown-section table { display: table; width: 100%; border-collapse: collapse; }
    .markdown-section tr { background: transparent; border-top: 1px solid var(--line); }
    .markdown-section th { background: var(--bg-alt); color: var(--fg-strong); }
    .markdown-section th, .markdown-section td { border: 1px solid var(--line); padding: 8px 12px; }
    .markdown-section tr:nth-child(2n) { background: #1c1c1c; }

    /* ---------- images: keep the original aspect ratio ----------
       the markdown carries width AND height attributes; once the width is
       clamped to the column, a fixed height would squash the image        */
    .markdown-section img,
    .markdown-section p img,
    .markdown-section video {
      height: auto !important;     /* never let a fixed height squash it */
      width: auto;                 /* honour the width attribute, then clamp */
      max-width: 100%;
      border-radius: 6px;
      background: #101010;
    }
    /* the feature banner and other oversized shots fill the column */
    .markdown-section p[align="center"] img { display: inline-block; }

    /* ---------- search ---------- */
    .sidebar .search { border-bottom: 1px solid var(--line); margin-bottom: 0; }
    .sidebar .search input {
      background: var(--bg-alt);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .sidebar .search input::placeholder { color: #757575; }
    .sidebar .search .results-panel { background: transparent; }
    .sidebar .search h2 { color: var(--fg-strong); }
    .sidebar .search p { color: var(--fg-dim); }
    .sidebar .search .matching-post { border-bottom: 1px solid var(--line); }
    .sidebar .search .search-keyword { color: var(--accent); background: transparent; font-style: normal; }

    /* ---------- pagination ---------- */
    .docsify-pagination-container { border-top: 1px solid var(--line); color: var(--fg-dim); }
    .pagination-item-title { color: var(--fg) !important; }
    .pagination-item-label { color: var(--accent-soft) !important; }
    .pagination-item a:hover .pagination-item-title { color: var(--accent) !important; }

    /* ---------- copy code button ---------- */
    .docsify-copy-code-button {
      background: var(--bg-alt) !important;
      color: var(--fg-dim) !important;
      border: 1px solid var(--line);
      border-radius: 5px;
      font-size: 11px !important;
    }
    .docsify-copy-code-button:hover { color: var(--accent) !important; }

    @media screen and (max-width: 768px) {
      #lang-switch { top: 8px; right: 60px; }
      #lang-switch a { padding: 4px 11px; font-size: 11.5px; }
    }
  </style>
</head>
<body>
  <div id="app">読み込み中…</div>
  <script>
    // Land on a language folder. docsify resolves _sidebar.md / _navbar.md
    // relative to the current folder, so we must never sit on the bare root.
    (function () {
      var h = location.hash;
      if (!h || h === '#' || h === '#/' || h === '#/#/') {
        var nav = (navigator.language || 'ja').toLowerCase();
        location.replace(location.pathname + location.search +
          (nav.indexOf('ja') === 0 ? '#/ja/' : '#/en/'));
      }
    })();

    // Language toggle. Deliberately standalone: it does not rely on docsify's
    // plugin lifecycle, so it still appears if a sidebar/page fetch fails.
    (function () {
      function paint() {
        var raw = location.hash.replace(/^#/, '') || '/ja/';
        var isEn = raw.indexOf('/en/') === 0;
        var ja = isEn ? raw.replace('/en/', '/ja/') : raw;
        var en = isEn ? raw : (raw.indexOf('/ja/') === 0 ? raw.replace('/ja/', '/en/') : '/en/');

        var el = document.getElementById('lang-switch');
        if (!el) {
          el = document.createElement('div');
          el.id = 'lang-switch';
          (document.body || document.documentElement).appendChild(el);
        }
        el.innerHTML =
          '<a href="#' + ja + '"' + (isEn ? '' : ' class="active"') + '>JP</a>' +
          '<a href="#' + en + '"' + (isEn ? ' class="active"' : '') + '>EN</a>';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', paint);
      } else {
        paint();
      }
      window.addEventListener('hashchange', paint);
      window.addEventListener('load', paint);
    })();

    window.$docsify = {
      name: '<img src="images/icon.png" alt="">ToPu:Weight Editor',
      nameLink: { '/en/': '#/en/', '/': '#/ja/' },
      repo: 'https://github.com/http4211/ToPu_weight_editor',

      loadSidebar: true,
      loadNavbar: false,

      // GitHub Pages (Jekyll) refuses to serve files starting with "_".
      // Point every _sidebar.md request at an underscore-free copy.
      alias: {
        '/ja/_sidebar.md': '/ja/sidebar.md',
        '/en/_sidebar.md': '/en/sidebar.md',
        '/_sidebar.md': '/ja/sidebar.md'
      },
      subMaxLevel: 0,
      maxLevel: 4,
      auto2top: true,

      fallbackLanguages: ['en'],

      search: {
        paths: 'auto',
        placeholder: { '/en/': 'Search', '/': '検索' },
        noData: { '/en/': 'No results', '/': '見つかりませんでした' },
        depth: 3
      },

      pagination: {
        crossChapter: true,
        crossChapterText: true,
        previousText: { '/en/': 'Previous', '/': '前へ' },
        nextText: { '/en/': 'Next', '/': '次へ' }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
