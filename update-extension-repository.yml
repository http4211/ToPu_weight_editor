name: Update Blender Extension Repository
on:
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: write
  pages: read
concurrency:
  group: blender-extension-index
  cancel-in-progress: false
jobs:
  update-index:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && github.event.release.draft == false)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate index from latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/build_extension_index.py --repository "$REPOSITORY" --output "$RUNNER_TEMP/tpwe-index.json"
      - name: Update gh-pages (preserve existing site files)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/tpwe-index.json" index.json
          git add index.json
          if git diff --cached --quiet; then
            echo "Index is already up to date."
          else
            git commit -m "Update Blender extension repository index"
            git push origin HEAD:gh-pages
          fi
      # A GITHUB_TOKEN commit does not trigger a branch-based Pages build.
      # Deploy the complete preserved gh-pages tree explicitly instead.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: update-index
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
