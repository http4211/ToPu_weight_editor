name: Update Blender Extension Repository
on:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_extension_index.py'
      - '.github/workflows/update-extension-repository.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: blender-extension-index
  cancel-in-progress: false
jobs:
  update-index:
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || (github.event.release.prerelease == false && github.event.release.draft == false)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage Wiki from docs
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          mkdir -p "$RUNNER_TEMP/tpwe-pages"
          cp -a docs/. "$RUNNER_TEMP/tpwe-pages/"
          touch "$RUNNER_TEMP/tpwe-pages/.nojekyll"
      - name: Generate index from latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/build_extension_index.py --repository "$REPOSITORY" --output "$RUNNER_TEMP/tpwe-pages/index.json"
      - name: Check Wiki and repository index
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          source = Path('docs')
          site = Path(os.environ['RUNNER_TEMP']) / 'tpwe-pages'
          for path in source.rglob('*'):
              if path.is_file() and path.relative_to(source).as_posix() not in ('index.json', '.nojekyll'):
                  assert (site / path.relative_to(source)).read_bytes() == path.read_bytes(), str(path)
          assert (site / 'index.html').is_file()
          index = json.loads((site / 'index.json').read_text())
          assert index['version'] == 'v1'
          assert index['data'][0]['id'] == 'topu_weight_editor'
          print('Wiki and extension index are ready for deployment.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/tpwe-pages
  deploy:
    needs: update-index
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
